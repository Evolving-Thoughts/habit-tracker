# Deployt main auf den Server, sobald CI für einen Push auf main grün ist.
# Einrichtung und Secrets: docs/deploy.md
name: Deploy
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deploy-production
  cancel-in-progress: false
jobs:
  deploy:
    name: Deploy auf den Server
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: https://plan.evolving-thoughts.com
    steps:
      - name: Deploy über SSH
        env:
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          # Aus einem Terminal kopiert, hat der Schlüssel oft \r oder Leerzeichen am Zeilenende.
          printf '%s\n' "$SSH_KEY" | tr -d '\r' | sed 's/[[:space:]]*$//' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          if ! ssh-keygen -y -f ~/.ssh/deploy_key >/dev/null 2>&1; then
            k=~/.ssh/deploy_key
            echo "::error::DEPLOY_SSH_KEY ist kein lesbarer privater Schlüssel (Zeilen: $(wc -l < $k), BEGIN-Zeile: $(grep -c 'BEGIN OPENSSH PRIVATE KEY' $k), END-Zeile: $(grep -c 'END OPENSSH PRIVATE KEY' $k)). Siehe docs/deploy.md."
            exit 1
          fi
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o ServerAliveInterval=30 "jonas@$DEPLOY_HOST" "deploy $SHA"
