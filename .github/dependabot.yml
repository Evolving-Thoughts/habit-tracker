# Wöchentliche, gebündelte Update-PRs. Sicherheitsupdates kommen davon unabhängig,
# sobald "Dependabot security updates" in den Repo-Einstellungen an ist.
# Jeder Merge wird nach grünem CI automatisch deployt (docs/deploy.md).
version: 2
updates:
  - package-ecosystem: npm
    directories: [/backend, /frontend]
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: docker
    directories: [/backend, /frontend]
    schedule:
      interval: weekly
      day: monday
    groups:
      base-images:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
