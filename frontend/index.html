<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#fde4d0" />
    <meta name="description" content="Deine Quests und Dailies. Nur für dich." />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Habit Tracker</title>
    <!--
      Sets the theme before the first paint, so a reload never flashes the
      other one. Same rules and colours as src/composables/useTheme.ts.
    -->
    <script>
      (function () {
        var choice = null;
        try {
          choice = localStorage.getItem("theme");
        } catch (error) {}
        var dark =
          choice === "dark" ||
          (choice !== "light" &&
            !!window.matchMedia &&
            window.matchMedia("(prefers-color-scheme: dark)").matches);
        var theme = dark ? "dark" : "light";
        document.documentElement.setAttribute("data-theme", theme);
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute("content", dark ? "#1e1611" : "#fde4d0");
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
